# Slack app manifest for pm-fyp (YAML). The same manifest in JSON is in
# slack-app-manifest.json — use whichever matches the tab selected in Slack's
# manifest editor. Pasting YAML into the JSON tab fails with a parse error on
# line 1 that looks like a problem with the manifest but is not.
#
# ORDER MATTERS. Socket Mode cannot be saved until an app-level token exists,
# so generate that token before applying this manifest:
#
#   1. https://api.slack.com/apps -> Create New App -> From scratch.
#   2. Basic Information -> App-Level Tokens -> Generate Token and Scopes.
#      Add the `connections:write` scope. The xapp-... value it shows once is
#      SLACK_APP_TOKEN.
#   3. App Manifest -> paste this (YAML tab) or the .json file (JSON tab) ->
#      Save Changes. Socket Mode now saves, because the token exists.
#   4. Install App -> Install to Workspace. OAuth & Permissions -> Bot User
#      OAuth Token is SLACK_BOT_TOKEN (xoxb-...).
#   5. In Slack, invite the bot to the demo channel: /invite @PM Agent
#
# Socket Mode is enabled deliberately: the app needs no public URL, so there is
# no tunnel to configure or to die in the middle of a demo.

display_information:
  name: PM Agent
  description: Turns stakeholder conversation into a plan, work breakdown, design, and prototype
  background_color: "#1f2933"

features:
  bot_user:
    display_name: PM Agent
    always_online: true
  slash_commands:
    - command: /pm
      description: Control the AI project manager
      usage_hint: "start | status | cancel"
      should_escape: false

oauth_config:
  scopes:
    bot:
      # Required by the app_mention event subscription below. Slack rejects the
      # manifest without it, naming the event rather than the scope.
      - app_mentions:read
      # Read the conversation the agent plans from.
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      # Post plans, approval prompts, and progress updates.
      - chat:write
      # Resolve user IDs to names so requirements read naturally.
      - users:read
      # The /pm slash command.
      - commands
      # React to a message to acknowledge it was captured.
      - reactions:write

settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - app_mention
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
