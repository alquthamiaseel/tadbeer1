services:
  db:
    image: postgres:16-alpine
    container_name: pmfyp-db
    # Comes back after a reboot or a Docker restart. Without this the database
    # silently disappears and every Slack command fails with a timeout that
    # looks like a Slack problem rather than a local one.
    restart: unless-stopped
    environment:
      POSTGRES_USER: pmfyp
      POSTGRES_PASSWORD: pmfyp
      POSTGRES_DB: pmfyp
    # 5433 on the host so it never collides with a local Postgres on 5432.
    ports:
      - "5433:5432"
    volumes:
      - pmfyp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmfyp -d pmfyp"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pmfyp-pgdata:
